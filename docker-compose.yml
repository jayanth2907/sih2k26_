version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: meghanetra-backend
    ports:
      - "8001:8001"
    environment:
      - APP_ENV=production
      - PORT=8001
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=http://backend:8001
    container_name: meghanetra-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8001
    depends_on:
      - backend
    restart: unless-stopped
